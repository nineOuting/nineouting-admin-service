server:
  port: ${SERVER_PORT:8086}
  # 파드가 내려갈 때 하던 요청은 마치고 끝낸다
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: admin-service

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

nineouting:
  admin:
    # 관리자 계정. 비밀값으로만 넣는다 (비밀번호는 BCrypt 해시). 비어 있으면 시작하지 않는다
    username: ${ADMIN_USERNAME:}
    password-hash: ${ADMIN_PASSWORD_HASH:}
    # 로그인 쿠키 서명 키 (32자 이상)
    session-secret: ${ADMIN_SESSION_SECRET:}
    session-ttl: 8h
    cookie-secure: ${ADMIN_COOKIE_SECURE:true}
    # 관리자 화면 주소 (CORS)
    allowed-origins: ${ADMIN_ALLOWED_ORIGINS:https://dev.nepnep.app}
    # 로그인 5번 틀리면 15분 잠금
    max-login-failures: 5
    lock-duration: 15m
    # 허용 IP 대역 (쉼표로). 비어 있으면 모두 받는다 (로컬, 시험)
    allowed-ips: ${ADMIN_ALLOWED_IPS:}
    # 클라이언트 IP를 찾을 때 건너뛸 CloudFront 대역 (AWS 공개 목록)
    cloudfront-ranges-url: ${ADMIN_CLOUDFRONT_RANGES_URL:https://ip-ranges.amazonaws.com/ip-ranges.json}
    # 주소가 비어 있는 DB는 목록에 넣지 않는다
    databases:
      user:
        url: ${DB_USER_URL:}
        username: ${DB_USER_USERNAME:}
        password: ${DB_USER_PASSWORD:}
      workspace:
        url: ${DB_WORKSPACE_URL:}
        username: ${DB_WORKSPACE_USERNAME:}
        password: ${DB_WORKSPACE_PASSWORD:}
      meeting:
        url: ${DB_MEETING_URL:}
        username: ${DB_MEETING_USERNAME:}
        password: ${DB_MEETING_PASSWORD:}
      minutes:
        url: ${DB_MINUTES_URL:}
        username: ${DB_MINUTES_USERNAME:}
        password: ${DB_MINUTES_PASSWORD:}
      notification:
        url: ${DB_NOTIFICATION_URL:}
        username: ${DB_NOTIFICATION_USERNAME:}
        password: ${DB_NOTIFICATION_PASSWORD:}
    # 감사 기록을 남길 관리자 전용 DB (REQ-216). 비어 있으면 로그로만 남긴다
    audit-database:
      url: ${DB_ADMIN_URL:}
      username: ${DB_ADMIN_USERNAME:}
      password: ${DB_ADMIN_PASSWORD:}
    # 운영 조치(REQ-217), 빠른 작업(REQ-218)을 맡길 서비스. 표를 직접 고치지 않고 각 서비스의 내부 기능을 부른다
    services:
      meeting-url: ${MEETING_SERVICE_URL:}
      minutes-url: ${MINUTES_SERVICE_URL:}
      user-url: ${USER_SERVICE_URL:}
      workspace-url: ${WORKSPACE_SERVICE_URL:}
